<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="840" height="620" role="img" aria-labelledby="nd-title nd-desc">
  <title id="nd-title">How the shop bots and the trading app connect</title>
  <desc id="nd-desc">The bots VM runs the front desk and specialist bots, uses connected services, and reaches the Ryzenator workstation through an approved SSH link. Ryzenator, Plexbeast, and the client trading-ops box share a private Tailscale mesh, and Ryzenator's trading app calls the Kalshi exchange API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/><stop offset="1" stop-color="#1a1a24"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.25" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.12"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.8" cy="0.8" r="0.5"><stop offset="0" stop-color="#41D8D7" stop-opacity="0.10"/><stop offset="1" stop-color="#41D8D7" stop-opacity="0"/></radialGradient>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#41D8D7"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
    <style>
      .h{font-family:'Space Grotesk',sans-serif;font-weight:700;fill:#fff}
      .t{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;fill:#a1a1aa}
      .eb{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;font-size:10px;letter-spacing:1.3px;fill:#a8d9ec}
      .card{fill:#16161f;stroke:rgba(255,255,255,0.12);stroke-width:1}
      .chip{fill:#202B3D;stroke:#298798;stroke-width:1}
      .chipt{font-family:Inter,sans-serif;font-size:11px;font-weight:500;fill:#e4ecee}
      .lbl{font-family:Inter,sans-serif;font-size:10.5px;font-weight:600}
    </style>
  </defs>

  <rect width="840" height="620" rx="24" fill="url(#bg)"/>
  <rect width="840" height="620" rx="24" fill="url(#glowA)"/>
  <rect width="840" height="620" rx="24" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="839" height="619" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>

  <!-- Header -->
  <text class="eb" x="28" y="40">NETWORK MAP</text>
  <text class="h" x="28" y="66" font-size="20">Bots, trading app, and the private mesh</text>

  <!-- Bots VM -->
  <rect x="28" y="96" width="360" height="152" rx="16" class="card" stroke="#41D8D7" style="stroke:#41D8D7;stroke-opacity:.7"/>
  <text class="h" x="48" y="126" font-size="16">Bots VM</text>
  <text class="t" x="48" y="145" font-size="11.5">Grok Bot cloud computer · front desk + specialist bots</text>
  <g>
    <rect x="48" y="162" width="100" height="26" rx="8" fill="#41D8D7"/><text x="98" y="179" text-anchor="middle" class="chipt" style="fill:#202B3D;font-weight:700">Front desk</text>
    <rect x="158" y="162" width="100" height="26" rx="8" class="chip"/><text x="208" y="179" text-anchor="middle" class="chipt">Pricing</text>
    <rect x="268" y="162" width="100" height="26" rx="8" class="chip"/><text x="318" y="179" text-anchor="middle" class="chipt">Scheduling</text>
    <rect x="48" y="198" width="100" height="26" rx="8" class="chip"/><text x="98" y="215" text-anchor="middle" class="chipt">Email</text>
    <rect x="158" y="198" width="100" height="26" rx="8" class="chip"/><text x="208" y="215" text-anchor="middle" class="chipt">Bookkeeping</text>
    <rect x="268" y="198" width="100" height="26" rx="8" class="chip"/><text x="318" y="215" text-anchor="middle" class="chipt">Inventory</text>
  </g>

  <!-- Bots VM <-> services -->
  <line x1="392" y1="172" x2="436" y2="172" stroke="#41D8D7" stroke-width="1.6" marker-start="url(#arT)" marker-end="url(#arT)"/>
  <text class="lbl" x="414" y="162" text-anchor="middle" fill="#41D8D7">APIs</text>

  <!-- Connected services -->
  <rect x="440" y="96" width="372" height="152" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.22)" stroke-dasharray="5 5"/>
  <text class="eb" x="460" y="124">CONNECTED SERVICES</text>
  <g>
    <rect x="460" y="142" width="104" height="26" rx="8" class="card"/><text x="512" y="159" text-anchor="middle" class="chipt">Gmail / Outlook</text>
    <rect x="574" y="142" width="112" height="26" rx="8" class="card"/><text x="630" y="159" text-anchor="middle" class="chipt">Google Calendar</text>
    <rect x="696" y="142" width="96" height="26" rx="8" class="card"/><text x="744" y="159" text-anchor="middle" class="chipt">Square</text>
    <rect x="460" y="178" width="104" height="26" rx="8" class="card"/><text x="512" y="195" text-anchor="middle" class="chipt">eBay API</text>
    <rect x="574" y="178" width="112" height="26" rx="8" class="card"/><text x="630" y="195" text-anchor="middle" class="chipt">GitHub</text>
  </g>
  <text class="t" x="460" y="230" font-size="11">Bots draft; nothing goes out without approval.</text>

  <!-- Tailscale mesh overlay -->
  <rect x="210" y="318" width="602" height="276" rx="20" fill="rgba(65,216,215,0.04)" stroke="#41D8D7" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="7 6"/>
  <g transform="translate(548,334)">
    <rect x="0" y="0" width="248" height="24" rx="12" fill="#202B3D" stroke="#298798"/>
    <!-- lock icon -->
    <g transform="translate(12,5)" fill="none" stroke="#41D8D7" stroke-width="1.5">
      <rect x="0.5" y="6" width="10" height="8" rx="1.5" fill="#41D8D7" stroke="none"/>
      <path d="M2.5 6 V4 a3 3 0 0 1 6 0 V6"/>
    </g>
    <text x="30" y="16" class="lbl" fill="#e4ecee">Tailscale mesh</text>
    <text x="124" y="16" class="t" font-size="10.5">private WireGuard</text>
  </g>

  <!-- SSH: Bots VM -> Ryzenator -->
  <line x1="320" y1="252" x2="320" y2="372" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arP)"/>
  <text class="lbl" x="332" y="276" fill="#c4b5fd">Approved remote command (SSH)</text>
  <g transform="translate(332,288)">
    <rect width="162" height="20" rx="10" fill="#1b1b28" stroke="#4b4b60"/>
    <circle cx="12" cy="10" r="3.5" fill="#88e0bb"/>
    <text x="22" y="14" class="t" font-size="10">Watchdog keeps tunnel up</text>
  </g>

  <!-- Ryzenator -->
  <rect x="236" y="376" width="196" height="104" rx="16" class="card" style="stroke:#a78bfa;stroke-opacity:.8"/>
  <text class="h" x="254" y="404" font-size="15">Ryzenator</text>
  <text class="t" x="254" y="424" font-size="11">Home workstation · Linux</text>
  <rect x="254" y="438" width="166" height="24" rx="8" fill="#202B3D" stroke="#298798"/>
  <text x="337" y="454" text-anchor="middle" class="chipt">Live trading app · weekdays</text>

  <!-- Kalshi (external) -->
  <rect x="28" y="398" width="160" height="60" rx="14" fill="#16161f" stroke="rgba(255,255,255,0.22)"/>
  <text class="h" x="44" y="423" font-size="13.5">Kalshi exchange</text>
  <text class="t" x="44" y="442" font-size="10.5">Public API</text>
  <line x1="234" y1="428" x2="194" y2="428" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arG)"/>

  <!-- Ryzenator <-> grok-box-1 -->
  <line x1="436" y1="428" x2="616" y2="428" stroke="#41D8D7" stroke-width="2" marker-start="url(#arT)" marker-end="url(#arT)"/>
  <text class="lbl" x="526" y="418" text-anchor="middle" fill="#41D8D7">direct peer-to-peer</text>
  <text class="lbl" x="526" y="446" text-anchor="middle" fill="#a8d9ec">Tailscale SSH</text>

  <!-- grok-box-1 -->
  <rect x="620" y="376" width="182" height="104" rx="16" class="card" style="stroke:#41D8D7;stroke-opacity:.6"/>
  <text class="h" x="636" y="402" font-size="13">Client trading-ops box</text>
  <text class="t" x="636" y="420" font-size="11">(grok-box-1)</text>
  <text class="t" x="636" y="446" font-size="10.5" style="fill:#e4ecee">Monitors the trading app</text>
  <text class="t" x="636" y="463" font-size="10.5" style="fill:#e4ecee">Emails status alerts</text>

  <!-- Plexbeast -->
  <line x1="300" y1="482" x2="300" y2="520" stroke="#71717a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text class="t" x="308" y="505" font-size="10">same home LAN</text>
  <rect x="236" y="522" width="196" height="50" rx="14" fill="#13131a" stroke="rgba(255,255,255,0.15)"/>
  <text class="h" x="254" y="544" font-size="13">Plexbeast</text>
  <text class="t" x="254" y="561" font-size="10.5">Home server</text>

  <!-- Legend -->
  <g transform="translate(620,516)" font-family="Inter,sans-serif" font-size="10">
    <line x1="0" y1="6" x2="22" y2="6" stroke="#41D8D7" stroke-width="2"/><text x="30" y="10" fill="#a1a1aa">Encrypted mesh link</text>
    <line x1="0" y1="24" x2="22" y2="24" stroke="#a78bfa" stroke-width="2"/><text x="30" y="28" fill="#a1a1aa">Approved SSH</text>
    <line x1="0" y1="42" x2="22" y2="42" stroke="#a1a1aa" stroke-width="2"/><text x="30" y="46" fill="#a1a1aa">External API call</text>
  </g>
</svg>
